{% extends "base.html" %}
{% block title %}学习追踪 — 期末复习{% endblock %}
{% block content %}
<div class="container">
    <h2>📊 学习追踪</h2>

    <div class="dash-row" style="margin:20px 0;">
        <div class="dash-card"><div class="dash-num" id="total-quizzes">0</div><div class="dash-label">测验完成</div></div>
        <div class="dash-card"><div class="dash-num" id="total-correct">0</div><div class="dash-label">总正确题数</div></div>
        <div class="dash-card"><div class="dash-num" id="streak-days">0</div><div class="dash-label">连续学习天数</div></div>
        <div class="dash-card"><div class="dash-num" id="total-wrong">0</div><div class="dash-label">错题收集</div></div>
    </div>

    <!-- 各科测验分数趋势 -->
    <h3 style="margin:24px 0 12px;">📈 各科测验成绩趋势</h3>
    <div id="subject-trends"></div>

    <!-- 最近测验记录 -->
    <h3 style="margin:24px 0 12px;">📋 最近测验记录</h3>
    <div id="quiz-history" class="empty-state"><p>还没有测验记录</p></div>

    <!-- 每周活跃度 -->
    <h3 style="margin:24px 0 12px;">🔥 最近 7 天活跃度</h3>
    <div id="weekly-heatmap" style="display:flex;gap:8px;"></div>

    <!-- 成就系统 -->
    <h3 style="margin:24px 0 12px;">🏆 成就徽章</h3>
    <div id="achievement-grid" class="achievement-grid"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
const quizHistory = JSON.parse(localStorage.getItem('quiz_history') || '[]');
const dailyActivity = JSON.parse(localStorage.getItem('daily_activity') || '{}');

// 计算统计
document.getElementById('total-quizzes').textContent = quizHistory.length;
const totalCorrect = quizHistory.reduce((s, q) => s + (q.correct || 0), 0);
const totalQuestions = quizHistory.reduce((s, q) => s + (q.total || 0), 0);
document.getElementById('total-correct').textContent = totalCorrect;

// 错题数（从 API 获取）
fetch('/api/dashboard').then(r => r.json()).then(d => {
    document.getElementById('total-wrong').textContent = d.wrong_total;
});

// 连续天数
const today = new Date().toISOString().split('T')[0];
let streak = 0;
for (let d = new Date(); ; d.setDate(d.getDate() - 1)) {
    const key = d.toISOString().split('T')[0];
    if (dailyActivity[key]) streak++;
    else break;
}
document.getElementById('streak-days').textContent = streak;

// 各科趋势
const subjects = ['复变函数','抽象代数','运筹学','数据结构 C','英语四六级'];
const colors = {'复变函数':'#3b82f6','抽象代数':'#10b981','运筹学':'#f59e0b','数据结构 C':'#ef4444','英语四六级':'#8b5cf6'};
let trendsHtml = '';
subjects.forEach(s => {
    const scores = quizHistory.filter(q => q.subject === s).map(q => Math.round(q.correct/q.total*100));
    const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b)/scores.length) : 0;
    const last5 = scores.slice(-5);
    const bars = last5.map(sc => {
        const h = Math.max(sc, 5);
        return `<div style="width:20px;height:${h}px;background:${colors[s]};border-radius:4px 4px 0 0;opacity:${sc/100+.2};" title="${sc}%"></div>`;
    }).join('');
    trendsHtml += `<div style="margin:12px 0;display:flex;align-items:center;gap:12px;">
        <span style="width:90px;font-size:13px;">${s}</span>
        <div style="display:flex;align-items:flex-end;gap:4px;height:100px;">${bars || '<span style="font-size:12px;color:var(--gray-600);">暂无数据</span>'}</div>
        <span style="font-size:13px;font-weight:600;color:${avg>=60?'#22c55e':avg>=30?'#f59e0b':'#ef4444'};">${avg}%</span>
    </div>`;
});
document.getElementById('subject-trends').innerHTML = trendsHtml;

// 最近记录
if (quizHistory.length) {
    const recent = quizHistory.slice(-5).reverse();
    document.getElementById('quiz-history').innerHTML = recent.map(q => `
        <div style="background:#fff;border-radius:8px;padding:12px;margin:6px 0;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:13px;">${q.date} · ${q.subject}</span>
            <span style="font-weight:600;color:${q.correct/q.total>=0.6?'#22c55e':'#ef4444'};">${q.correct}/${q.total}</span>
        </div>
    `).join('');
}

// 周活跃热力图
const days = ['日','一','二','三','四','五','六'];
let heatmap = '';
for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = d.toISOString().split('T')[0];
    const active = dailyActivity[key] || 0;
    const intensity = Math.min(active * 30, 100);
    heatmap += `<div style="text-align:center;">
        <div style="width:36px;height:36px;border-radius:6px;background:${active?'var(--blue)':'#e5e7eb'};opacity:${active?intensity/100:.4};"></div>
        <div style="font-size:10px;margin-top:2px;">${days[d.getDay()]}</div>
    </div>`;
}
document.getElementById('weekly-heatmap').innerHTML = heatmap;

// 成就列表
setTimeout(function() {
    var unlocked = JSON.parse(localStorage.getItem('achievements') || '[]');
    var unlockedIds = unlocked.map(function(a) { return a.id; });
    var allAch = window._achievements ? window._achievements.getAll() : [];
    var grid = document.getElementById('achievement-grid');
    if (!allAch.length) { grid.innerHTML = '<p style="color:var(--text-secondary);">成就系统加载中...</p>'; return; }
    grid.innerHTML = allAch.map(function(ach) {
        var isUnlocked = unlockedIds.indexOf(ach.id) >= 0;
        var unlockDate = '';
        if (isUnlocked) {
            var u = unlocked.find(function(x) { return x.id === ach.id; });
            if (u) unlockDate = '<div style="font-size:10px;color:var(--text-secondary);margin-top:2px;">' + u.unlockedAt.split('T')[0] + '</div>';
        }
        return '<div class="achievement-card' + (isUnlocked ? '' : ' locked') + '">' +
            '<div class="ach-icon">' + (isUnlocked ? ach.icon : '🔒') + '</div>' +
            '<div class="ach-name">' + ach.name + '</div>' +
            '<div class="ach-desc">' + ach.desc + '</div>' +
            unlockDate +
        '</div>';
    }).join('');
}, 1500);
</script>
{% endblock %}
